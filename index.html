<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forsaken Chess</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="hud-top">
    <div class="stats-group">
      <div class="stat-box">
        <div class="stat-title stage">ЭТАП</div>
        <div class="stat-val" id="ui-stage">1</div>
      </div>
      <div class="stat-box">
        <div class="stat-title lost">LOST</div>
        <div class="stat-val" id="ui-lost">0 / 10</div>
      </div>
      <div class="stat-box">
        <div class="stat-title win">WIN</div>
        <div class="stat-val" id="ui-win">0 / 15</div>
      </div>
    </div>
    <div class="controls-right">
      <button id="btn-speed">⏩ x1</button>
      <button id="btn-regen">🎲 Новая карта</button>
    </div>
  </div>
  <div class="hud-bottom">
    <div class="mana-badge">💎 Энергия: <span id="ui-mana">100</span></div>
    <button id="btn-summon">♟ Призвать Пешку (40)</button>
    <div class="hint">
      Эволюция по ★: <b>Пешка ➔ Конь ➔ Слон ➔ Ладья ➔ Ферзь</b>. Клик по клетке ставит или улучшает фигуру.
    </div>
  </div>
  <div class="overlay" id="overlay">
    <h1 id="overlay-title">ЭТАП ПРОЙДЕН!</h1>
    <p id="overlay-desc">Карта будет перестроена для следующего уровня.</p>
    <button id="btn-next" class="btn-primary">Следующий этап ➔</button>
  </div>
  <canvas id="gameCanvas"></canvas>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
