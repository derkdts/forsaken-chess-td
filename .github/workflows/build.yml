name: Manual Build (Windows & Linux)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия релиза (например, 0.1.0)'
        required: true
        default: '0.1.0'
        type: string
permissions:
  contents: write
jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install frontend dependencies
        run: npm install
      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Generate placeholder icon if missing
        shell: bash
        run: |
          if [ ! -f "src-tauri/icons/icon.ico" ]; then
            node -e "
              const fs = require('fs');
              const png = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==', 'base64');
              fs.writeFileSync('temp-icon.png', png);
            "
            npx tauri icon temp-icon.png
            rm temp-icon.png
          fi
      - name: Build Tauri application and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ github.event.inputs.version }}
          releaseName: 'Forsaken Chess v${{ github.event.inputs.version }}'
          releaseBody: 'Автономные сборки для Windows (.msi / .exe) и Linux (.deb / .AppImage).'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}